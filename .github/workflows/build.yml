          <resources>
              <string name="app_name">ভলিউম কল রিসিভ</string>
              <string name="service_desc">ফোন বাজার সময় ভলিউম বাটন চেপে কল রিসিভ করার জন্য এই সার্ভিস ভলিউম বাটনের চাপ শনাক্ত করে। অন্য কোনো তথ্য পড়ে না বা সংগ্রহ করে না।</string>
          </resources>
          PB_END_OF_FILE
          mkdir -p 'app/src/main/res/xml'
          cat > 'app/src/main/res/xml/accessibility_service_config.xml' <<'PB_END_OF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          PB_END_OF_FILE
          cat > 'build.gradle.kts' <<'PB_END_OF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          PB_END_OF_FILE
          cat > 'gradle.properties' <<'PB_END_OF_FILE'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          PB_END_OF_FILE
          cat > 'settings.gradle.kts' <<'PB_END_OF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VolumeAnswer"
          include(":app")
          PB_END_OF_FILE

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeAnswer-APK
          path: app/build/outputs/apk/debug/*.apk
